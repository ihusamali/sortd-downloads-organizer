[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sortd-downloads-organizer"
version = "0.1.0"
description = "Local-first Downloads folder organizer CLI with rule-based routing and PDF classification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Husam Ali" }]
keywords = [
    "downloads-folder-organizer",
    "file-organizer",
    "python-cli",
    "local-first",
    "pdf-classification",
    "ollama",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2", "PyYAML>=6", "watchdog>=4", "Pillow>=10", "pillow-heif>=0.16", "PyMuPDF>=1.24", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/ihusamali/sortd-downloads-organizer"
Repository = "https://github.com/ihusamali/sortd-downloads-organizer"
Issues = "https://github.com/ihusamali/sortd-downloads-organizer/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6"]

[project.scripts]
sortd = "sortd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sortd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sortd/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
ignore_missing_imports = true

